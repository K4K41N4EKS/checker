<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel='stylesheet' href='settings-style.css'>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Нормоконтроль</title>
</head>
<body>  
    <header>
        <a id="checker" href="sample.html">Checker GOST </a>
        <div id="header"> 
            <a class="header" href="sample.html">Главная</a>
            <a class="header" href="#">О нас</a>
            <a class="header" target="_blank" href="gostTUSUR.html">Официальный ГОСТ ТУСУР</a>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="text-main">
                <h1>Выберите файл для проверки нормоконтроля</h1>
            </div>
            <form id="uploadForm" onsubmit="handleFileUpload(event); event.preventDefault();">
                <div class="file-container">
                    <input type="file" id="fileInput" accept=".docx,.doc" required onchange="updateFileName()">
                    <label for="fileInput" class="file-button">Выбрать файл</label>
                    <span id="fileName">Ваш файл: Выберите файл</span>
                </div>
                <input type="hidden" id="templateId" value="YOUR_TEMPLATE_ID_HERE"> <!-- Скрытое поле для template_id -->
                <div class="start-button-container">
                    <button class="start-button" type="submit">Начать</button>
                </div>
            </form>
            <div class="download-file">
                <h1 id="processing-file" style="display: none;">Обработка файла</h1>
                <div id="progressContainer" style="display: none;">
                    <progress id="progressBar" value="0" max="100"></progress>
                    <span id="progressText">0%</span>
                </div>
                <div id="downloadContainer" style="display: none;">
                    <button id="downloadButton" onclick="downloadFile()">Скачать обработанный файл</button>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-left">
            <p id="checker-footer">Checker GOST </p>
            <a class="footer" href="sample.html">Главная</a>
            <a class="footer" href="#">О нас</a>
            <a class="footer" target="_blank" href="gostTUSUR.html">Официальный ГОСТ ТУСУР</a>
        </div>
        <div class="footer-right">
            <p id="footer-phone"> +7(952)159-02-56</p>
            <p id="footer-email"> saharovandy@yandex.ru</p>
        </div>
    </footer> 
  
    <script src="button.js"></script>
</body>
</html>
