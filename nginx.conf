events {
    worker_connections 1024;
}

http {
    # Serve UTF-8 for all text assets to avoid mojibake
    charset utf-8;
    charset_types text/html text/plain text/css text/xml application/json application/javascript text/javascript;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    server {
        listen 80;
        server_name localhost;
        
        # Увеличиваем лимит размера загружаемых файлов
        client_max_body_size 50M;
        root /usr/share/nginx/html;
        index index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self' 'nonce-frontend'; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self';" always;
        
        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        
        # Cache static assets (except JS and CSS for development)
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # No cache for JS and CSS files during development
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT";
            add_header Last-Modified $date_gmt;
            add_header ETag off;
            if_modified_since off;
            expires off;
        }
        
        # API proxy to backend
        location /api/ {
            proxy_pass http://checker_backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            proxy_set_header X-Internal-Secret $http_x_internal_secret;
            proxy_set_header user_id $http_user_id;
            proxy_set_header username $http_username;
            
            # Debug headers
            add_header X-Debug-Original-Headers "$http_x_internal_secret|$http_user_id|$http_username" always;
        }
        
        # Base proxy config for auth service (C++ Drogon)
        location /auth/ {
            proxy_pass http://auth-for-check-app:3333/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            # Forward refresh cookie as header for upstream compatibility
            proxy_set_header refresh-token $cookie_refresh;

            # CORS with credentials
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, username, passwd, refresh-token, access-token" always;
            add_header Access-Control-Expose-Headers "access-token, refresh-token" always;

            # Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Vary Origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, username, passwd, refresh-token, access-token" always;
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }
        }

        # Set HttpOnly cookie with refresh token on successful login
        location = /auth/login {
            proxy_pass http://auth-for-check-app:3333/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            # CORS with credentials
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Expose-Headers "access-token, refresh-token" always;
            # Forward refresh cookie as header (not used on login but harmless)
            proxy_set_header refresh-token $cookie_refresh;
            # Map upstream header to HttpOnly cookie for the browser
            proxy_hide_header refresh-token;
            add_header Set-Cookie "refresh=$upstream_http_refresh_token; Path=/; HttpOnly; SameSite=Strict" always;
        }

        # Logout: clear refresh cookie
        location = /auth/logout {
            proxy_pass http://auth-for-check-app:3333/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            proxy_set_header refresh-token $cookie_refresh;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Expose-Headers "access-token, refresh-token" always;
            add_header Set-Cookie "refresh=; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/; HttpOnly; SameSite=Strict" always;
        }
        
        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
